name: BattleCards
version: 4.0.0
main: com.cardcombat.CardCombatPlugin
author: BattleCards
description: Rebuilt BattleCards card combat system for Spigot 1.12.2 / Eaglercraft
commands:
  battlecards:
    description: BattleCards main command
    aliases: [bc]
  challenge:
    description: Challenge a player
  accept:
    description: Accept a card challenge
  ritual:
    description: Start a BattleCards ritual
  shop:
    description: Card Coin shop
  missions:
    description: Card Coin missions
  match:
    description: Official matchmaking
  bot:
    description: Practice bot
permissions:
  battlecards.admin:
    default: op
  battlecards.play:
    default: true
  battlecards.class.reset:
    default: true
  battlecards.staff:
    default: op
  cardcombat.challenge:
    default: true
  battlecards.ritual:
    default: true
